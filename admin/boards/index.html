<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>게시글 관리 | 거상마케팅센터</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/admin.css?v=1"></head><body class="admin-page" data-admin-page="boards"><div class="admin-shell"><aside class="admin-side"><h1>거상마케팅센터 관리자</h1><a href="/admin">현황</a><a class="active" href="/admin/boards">게시글 관리</a><a href="/admin/inquiries">문의 관리</a><a href="/admin/leads">자료 신청자</a><button id="adminLogout">로그아웃</button></aside><main class="admin-main"><div class="admin-head"><h1>게시글 관리</h1><button class="admin-btn secondary" id="newPost">새 글</button></div><section class="admin-panel"><form id="postForm" class="admin-form"><input type="hidden" name="id"><div class="admin-form-grid"><label>유형<select name="postType" required><option value="notice">공지사항</option><option value="faq">FAQ</option><option value="resource">무료 자료</option></select></label><label>상태<select name="status"><option value="draft">임시저장</option><option value="published">발행</option><option value="archived">보관</option></select></label><label>분류<input name="category" required value="안내" maxlength="80"></label><label>슬러그<input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="english-slug"></label><label class="admin-span-2">제목<input name="title" required maxlength="160"></label><label class="admin-span-2">요약<textarea name="excerpt" maxlength="500"></textarea></label><label class="admin-span-2">본문<textarea name="body" required></textarea></label><label>다운로드 방식<select name="downloadMode"><option value="lead_gate">신청 후 다운로드</option><option value="direct">바로 다운로드</option></select></label><label>자료 버전<input name="resourceVersion" placeholder="예: 2026.09"></label><label>관련 서비스 문구<input name="relatedServiceLabel"></label><label>관련 서비스 경로<input name="relatedServiceHref" placeholder="/services/smartplace"></label><label>대상 독자 (한 줄에 하나)<textarea name="targetAudience"></textarea></label><label>활용 방법 (한 줄에 하나)<textarea name="usageSteps"></textarea></label><label class="admin-span-2">첨부파일 (최대 5개, 파일당 20MB)<input type="file" name="files" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.zip"><div class="file-progress"><span id="uploadProgress"></span></div><div id="attachedFiles"></div></label></div><div class="admin-actions"><button class="admin-btn" type="submit">저장</button><button class="admin-btn secondary" type="reset">입력 지우기</button></div><div id="adminStatus" class="admin-status" role="status"></div></form></section><section class="admin-panel admin-table-wrap"><table class="admin-table"><thead><tr><th>유형</th><th>제목</th><th>상태</th><th>분류</th><th>관리</th></tr></thead><tbody id="postRows"></tbody></table></section></main></div><script src="/board-config.js?v=1"></script><script src="/admin.js?v=1"></script></body></html>
